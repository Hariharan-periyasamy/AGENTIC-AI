<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Manage Requests', ~{::content})}">
<body>
<div th:fragment="content">
    <h4 class="mb-4">Manage Requests</h4>

    <!-- Search / Filter -->
    <div class="card p-3 mb-4 bg-light">
        <form th:action="@{/admin/requests}" method="get" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-bold text-muted">Status</label>
                <select name="status" class="form-select form-select-sm">
                    <option value="">All Statuses</option>
                    <option th:each="st : ${statuses}"
                            th:value="${st}" th:text="${st}"
                            th:selected="${st == selectedStatus}"></option>
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label small fw-bold text-muted">Search Applicant (Name/Email)</label>
                <input type="text" name="keyword" class="form-control form-control-sm"
                       th:value="${keyword}" placeholder="e.g. John or email@..."/>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                    <i class="bi bi-search me-1"></i>Search
                </button>
            </div>
        </form>
    </div>

    <!-- Results Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Applicant</th>
                        <th>Type</th>
                        <th>Submitted</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="req : ${requests}">
                        <td th:text="${req.id}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${req.applicantName}"></div>
                            <div class="small text-muted" th:text="${req.applicantEmail}"></div>
                        </td>
                        <td th:text="${req.certificateTypeName}"></td>
                        <td th:text="${#temporals.format(req.createdAt,'dd MMM yy HH:mm')}"></td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="'badge-' + ${req.status}"
                                  th:text="${req.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/requests/{id}(id=${req.id})}"
                               class="btn btn-sm btn-outline-primary">Review</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="6" class="text-center text-muted py-4">No requests found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
