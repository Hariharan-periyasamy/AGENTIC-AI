<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Audit Logs', ~{::content})}">
<body>
<div th:fragment="content">
    <h4 class="mb-4">System Audit Logs</h4>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 600px;">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark" style="position: sticky; top: 0; z-index: 1;">
                        <tr>
                            <th>ID</th>
                            <th>Timestamp</th>
                            <th>Action</th>
                            <th>Performed By</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td class="text-muted small" th:text="${log.id}"></td>
                            <td class="small" th:text="${#temporals.format(log.timestamp,'dd MMM yy HH:mm:ss')}"></td>
                            <td>
                                <span class="badge bg-secondary" th:text="${log.action}"></span>
                            </td>
                            <td class="fw-semibold" th:text="${log.performedBy}"></td>
                            <td class="small text-muted text-break" style="max-width:300px;" th:text="${log.details}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="5" class="text-center py-4 text-muted">No audit logs found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
