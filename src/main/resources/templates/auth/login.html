<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Certificate System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="fw-bold mt-2 text-primary">University Portal</h3>
                <p class="text-muted">Digital Certificate System</p>
            </div>
            
            <div th:if="${param.error}" class="alert alert-danger shadow-sm">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success shadow-sm">
                <i class="bi bi-check-circle-fill me-2"></i>You have been logged out.
            </div>
            <div th:if="${param.registered}" class="alert alert-success shadow-sm">
                <i class="bi bi-check-circle-fill me-2"></i>Registration successful! Please login.
            </div>
            <div th:if="${successMessage}" class="alert alert-success shadow-sm">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header text-center py-3">
                    <h5 class="mb-0 fw-bold">Sign In</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-lg" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Login</button>
                    </form>
                </div>
                <div class="card-footer bg-white text-center py-3">
                    <p class="mb-0 text-muted">Don't have an account? <a th:href="@{/register}" class="fw-bold">Register Here</a></p>
                </div>
            </div>
            <div class="text-center mt-4">
                <a th:href="@{/verify}" class="text-decoration-none fw-bold text-secondary"><i class="bi bi-shield-check me-1"></i> Public Certificate Verification</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
