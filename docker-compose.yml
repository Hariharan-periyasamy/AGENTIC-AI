version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dcs_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cert_system}
      MYSQL_USER: ${DB_USER:-cert_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cert_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dcs_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-cert_system}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-cert_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-cert_pass}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  app_uploads:
