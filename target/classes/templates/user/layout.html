<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Student Portal - Digital Certificate System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <nav class="sidebar d-flex flex-column" style="width:260px; min-width:260px;">
        <div class="brand">
            <i class="bi bi-mortarboard-fill me-2"></i>Student Portal
        </div>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/user/dashboard}"
                   th:classappend="${requestUri == '/user/dashboard' ? 'active' : ''}">
                    <i class="bi bi-grid-1x2-fill me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/user/requests}"
                   th:classappend="${requestUri.startsWith('/user/requests') ? 'active' : ''}">
                    <i class="bi bi-file-earmark-text-fill me-2"></i>My Requests
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/user/certificates}"
                   th:classappend="${requestUri.startsWith('/user/certificates') ? 'active' : ''}">
                    <i class="bi bi-award-fill me-2"></i>Certificates
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/user/notifications}"
                   th:classappend="${requestUri.startsWith('/user/notifications') ? 'active' : ''}">
                    <i class="bi bi-bell-fill me-2"></i>Notifications
                </a>
            </li>
            <li class="nav-item mt-4">
                <a class="nav-link text-white-50" th:href="@{/user/profile}"
                   th:classappend="${requestUri == '/user/profile' ? 'active' : ''}">
                    <i class="bi bi-person-circle me-2"></i>Profile Settings
                </a>
            </li>
        </ul>
        <div class="mt-auto p-4 border-top border-secondary border-opacity-25">
            <div class="text-white-50 small mb-3 fw-bold" sec:authentication="name">user@example.com</div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm w-100 fw-bold">
                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
            </form>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-grow-1 main-content bg-light">
        <!-- Global Alerts -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- View Content -->
        <div th:replace="${content}">Content here</div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
