<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate Verification Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body class="bg-light pt-5">
<div class="container text-center" style="max-width: 650px;">
    <div class="card shadow-sm p-5">
        <h3 class="mb-4">Verification Result</h3>

        <div th:if="${valid}">
            <i class="bi bi-patch-check-fill text-success" style="font-size: 5rem;"></i>
            <h4 class="text-success mt-3 fw-bold">VALID CERTIFICATE</h4>
            <hr class="my-4"/>
            <dl class="row text-start mb-0 fs-5">
                <dt class="col-sm-5 text-muted">Holder Name</dt>
                <dd class="col-sm-7 fw-bold" th:text="${certificate.certificateRequest.user.firstName + ' ' + certificate.certificateRequest.user.lastName}"></dd>
                
                <dt class="col-sm-5 text-muted">Certificate Type</dt>
                <dd class="col-sm-7 fw-bold" th:text="${certificate.certificateRequest.certificateType.name}"></dd>
                
                <dt class="col-sm-5 text-muted">Certificate No.</dt>
                <dd class="col-sm-7 font-monospace" th:text="${certificate.certificateNumber}"></dd>
                
                <dt class="col-sm-5 text-muted">Issue Date</dt>
                <dd class="col-sm-7" th:text="${#temporals.format(certificate.issuedAt, 'dd MMM yyyy')}"></dd>

                <dt class="col-sm-5 text-muted">Issuing Authority</dt>
                <dd class="col-sm-7">Digital Certificate Authority</dd>
            </dl>
            <div class="mt-4 pt-3 border-top">
                <a th:href="@{/verify/download/{uuid}(uuid=${certificate.uuid})}" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-download me-2"></i> Download PDF
                </a>
            </div>
        </div>

        <div th:if="${!valid}">
            <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
            <h4 class="text-danger mt-3 fw-bold">INVALID CERTIFICATE</h4>
            <div class="alert alert-danger mt-4">
                The provided code <strong th:text="${searchedCode}"></strong> does not match any valid certificate in our system.
            </div>
        </div>
        
        <div class="mt-5">
            <a th:href="@{/verify}" class="btn btn-outline-secondary">
                <i class="bi bi-search me-1"></i> Verify Another
            </a>
            <a th:href="@{/}" class="btn btn-link">Home</a>
        </div>
    </div>
</div>
</body>
</html>
