<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/layout :: layout('New Certificate Request', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/user/requests}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <h4 class="mb-0">New Certificate Request</h4>
    </div>

    <div class="card p-4" style="max-width:700px;">
        <form th:action="@{/user/requests/new}" th:object="${submitDto}" method="post" enctype="multipart/form-data">
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Select Certificate Type <span class="text-danger">*</span></label>
                <select class="form-select" th:field="*{certificateTypeId}" required>
                    <option value="">-- Choose Type --</option>
                    <option th:each="type : ${certificateTypes}"
                            th:value="${type.id}"
                            th:text="${type.name}"></option>
                </select>
                <div class="text-danger small mt-1" th:errors="*{certificateTypeId}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Purpose of Request <span class="text-danger">*</span></label>
                <textarea class="form-control" th:field="*{purpose}" rows="3" required
                          placeholder="Please explain why you need this certificate..."></textarea>
                <div class="text-danger small mt-1" th:errors="*{purpose}"></div>
                <div class="form-text">Maximum 500 characters.</div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Additional Remarks</label>
                <textarea class="form-control" th:field="*{remarks}" rows="2"
                          placeholder="Optional notes for the reviewer..."></textarea>
                <div class="text-danger small mt-1" th:errors="*{remarks}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Supporting Document <span class="text-danger">*</span></label>
                <input type="file" class="form-control" id="document" name="document" 
                       accept=".pdf,.jpg,.jpeg,.png" required/>
                <div class="form-text">Please upload proof/identification (Max 5MB. PDF, JPG, PNG).</div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/user/requests}" class="btn btn-light">Cancel</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send me-1"></i>Submit Request
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
