<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/layout :: layout('My Profile', ~{::content})}">
<body>
<div th:fragment="content">
    <h4 class="mb-4">My Profile</h4>
    <div class="card p-4" style="max-width:540px;">
        <form th:action="@{/user/profile}" th:object="${profileDto}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="text" class="form-control" th:value="*{email}" readonly/>
                <div class="form-text">Email cannot be changed.</div>
            </div>
            <div class="row">
                <div class="col mb-3">
                    <label class="form-label fw-semibold">First Name</label>
                    <input type="text" class="form-control" th:field="*{firstName}" required/>
                    <div class="text-danger small" th:errors="*{firstName}"></div>
                </div>
                <div class="col mb-3">
                    <label class="form-label fw-semibold">Last Name</label>
                    <input type="text" class="form-control" th:field="*{lastName}" required/>
                    <div class="text-danger small" th:errors="*{lastName}"></div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-floppy me-1"></i>Save Changes
            </button>
        </form>
    </div>
</div>
</body>
</html>
