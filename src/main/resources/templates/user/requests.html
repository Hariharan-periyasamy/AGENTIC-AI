<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/layout :: layout('My Requests', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">My Certificate Requests</h4>
        <a th:href="@{/user/requests/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>New Request
        </a>
    </div>

    <div th:if="${#lists.isEmpty(requests)}" class="alert alert-info">
        <i class="bi bi-info-circle me-2"></i>You have not submitted any certificate requests yet.
    </div>

    <div th:if="${!#lists.isEmpty(requests)}" class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Certificate Type</th>
                        <th>Status</th>
                        <th>Submitted</th>
                        <th>Last Updated</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="req : ${requests}">
                        <td th:text="${req.id}"></td>
                        <td th:text="${req.certificateTypeName}"></td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="'badge-' + ${req.status}"
                                  th:text="${req.status}">PENDING</span>
                        </td>
                        <td th:text="${#temporals.format(req.createdAt,'dd MMM yyyy HH:mm')}"></td>
                        <td th:text="${#temporals.format(req.updatedAt,'dd MMM yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/user/requests/{id}(id=${req.id})}"
                               class="btn btn-sm btn-outline-primary">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
