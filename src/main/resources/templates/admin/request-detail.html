<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout('Review Request', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center mb-4 gap-2">
        <a th:href="@{/admin/requests}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <h4 class="mb-0">Review Request #<span th:text="${certRequest.id}"></span></h4>
    </div>

    <div class="row g-4">
        <!-- Request Info -->
        <div class="col-md-7">
            <div class="card p-4 h-100">
                <h5 class="border-bottom pb-2 mb-3">Request Details</h5>
                
                <dl class="row mb-0">
                    <dt class="col-sm-4 text-muted">Status</dt>
                    <dd class="col-sm-8">
                        <span class="badge rounded-pill"
                              th:classappend="'badge-' + ${certRequest.status}"
                              th:text="${certRequest.status}"></span>
                    </dd>

                    <dt class="col-sm-4 text-muted">Type</dt>
                    <dd class="col-sm-8 fw-bold" th:text="${certRequest.certificateType.name}"></dd>
                    
                    <dt class="col-sm-4 text-muted">Submitted</dt>
                    <dd class="col-sm-8" th:text="${#temporals.format(certRequest.createdAt,'dd MMM yyyy HH:mm')}"></dd>

                    <dt class="col-sm-4 text-muted mt-3">Purpose</dt>
                    <dd class="col-sm-8 mt-3 bg-light p-2 rounded" th:text="${certRequest.purpose}"></dd>

                    <dt class="col-sm-4 text-muted" th:if="${not #strings.isEmpty(certRequest.remarks)}">Remarks</dt>
                    <dd class="col-sm-8 bg-light p-2 rounded" th:if="${not #strings.isEmpty(certRequest.remarks)}" th:text="${certRequest.remarks}"></dd>

                    <th:block th:if="${certRequest.status.name() == 'REJECTED'}">
                        <dt class="col-sm-4 text-danger mt-3">Rejection Reason</dt>
                        <dd class="col-sm-8 text-danger mt-3 fw-bold" th:text="${certRequest.rejectionReason}"></dd>
                    </th:block>
                </dl>
            </div>
        </div>

        <!-- Applicant Info & Document -->
        <div class="col-md-5">
            <div class="card p-4 mb-4">
                <h6 class="text-muted border-bottom pb-2 mb-3">Applicant Information</h6>
                <div><strong>Name:</strong> <span th:text="${certRequest.user.firstName + ' ' + certRequest.user.lastName}"></span></div>
                <div><strong>Email:</strong> <span th:text="${certRequest.user.email}"></span></div>
            </div>

            <div class="card p-4">
                <h6 class="text-muted border-bottom pb-2 mb-3">Supporting Document</h6>
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-file-earmark-pdf fs-3 text-danger"></i>
                    <div class="text-break small" th:text="${certRequest.supportingDocumentPath}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Actions (Only show if UNDER_REVIEW or PENDING) -->
    <div class="card p-4 mt-4 bg-light border-0" th:if="${certRequest.status.name() == 'UNDER_REVIEW' or certRequest.status.name() == 'PENDING'}">
        <h5 class="mb-3">Admin Actions</h5>
        
        <div class="row">
            <!-- Approve Form -->
            <div class="col-md-4">
                <form th:action="@{/admin/requests/{id}/approve(id=${certRequest.id})}" method="post"
                      onsubmit="return confirm('Are you sure you want to APPROVE this request? A certificate will be generated.');">
                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold">
                        <i class="bi bi-check-circle me-2"></i>Approve Request
                    </button>
                </form>
            </div>
            
            <!-- Reject Form -->
            <div class="col-md-8 border-start">
                <form th:action="@{/admin/requests/{id}/reject(id=${certRequest.id})}" th:object="${reviewDto}" method="post">
                    <div class="mb-2">
                        <label class="form-label fw-bold text-danger">Rejection Reason <span class="text-danger">*</span></label>
                        <textarea class="form-control border-danger" th:field="*{rejectionReason}" rows="2" 
                                  placeholder="Required if rejecting..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-outline-danger" 
                            onsubmit="return confirm('Are you sure you want to REJECT this request?');">
                        <i class="bi bi-x-circle me-1"></i>Reject Request
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
