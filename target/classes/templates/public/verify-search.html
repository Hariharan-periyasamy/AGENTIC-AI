<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Certificate - Digital Certificate System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>
<body class="bg-light pt-5">
<div class="container" style="max-width: 600px;">
    
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white p-4 text-center">
            <h4 class="mb-0"><i class="bi bi-shield-check me-2"></i>Verify Certificate</h4>
        </div>
        <div class="card-body p-5">
            <p class="text-muted text-center mb-4">
                Enter the Certificate Number or the Verification Code (UUID) below to confirm its authenticity.
            </p>
            
            <form th:action="@{/verify/search}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">Certificate No. / Verification Code</label>
                    <input type="text" name="code" class="form-control form-control-lg text-center" 
                           placeholder="e.g. CERT-2024-000001 or 550e8400-e29b..." required autofocus/>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    Verify Now
                </button>
            </form>
        </div>
        <div class="card-footer bg-white text-center text-muted py-3">
            <a th:href="@{/}" class="text-decoration-none">Back to Home</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
